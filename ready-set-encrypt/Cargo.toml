[package]
name         = "ready-set-encrypt"
version      = "0.1.2"
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Secrets capability provider plugin for ready-set."
keywords     = ["ready-set", "secrets", "plugin"]
categories   = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ready-set-encrypt"
path = "src/main.rs"

# AppContainer launcher — Windows-only. Plugin's `sandbox::wrap` on
# Windows returns argv prefixed by this binary, which then sets up the
# AppContainer SID + per-path ACL grants and spawns the child via
# `CreateProcessW` with `STARTUPINFOEXW.SECURITY_CAPABILITIES`. Only the
# launcher uses Win32 FFI directly; everything else stays safe Rust.
[[bin]]
name              = "ready-set-encrypt-launcher"
path              = "src/bin/launcher.rs"
required-features = []

[dependencies]
ready-set-sdk    = { workspace = true }
aes-gcm          = { workspace = true }
base64           = { workspace = true }
chacha20poly1305 = { workspace = true }
clap             = { workspace = true }
directories      = { workspace = true }
getrandom        = { workspace = true }
regex            = { workspace = true }
semver           = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
sha2             = { workspace = true }
tempfile         = { workspace = true }
thiserror        = { workspace = true }
time             = { workspace = true }
toml             = { workspace = true }
toml_edit        = { workspace = true }
ureq             = { workspace = true }
walkdir          = { workspace = true }
which            = { workspace = true }
zeroize          = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
unsafe_code              = "allow"
missing_docs             = "deny"
let_underscore_drop      = "warn"
non_ascii_idents         = "warn"
single_use_lifetimes     = "warn"
trivial_casts            = "warn"
trivial_numeric_casts    = "warn"
unused_extern_crates     = "warn"
unused_import_braces     = "warn"
unused_lifetimes         = "warn"
unused_qualifications    = "warn"
variant_size_differences = "warn"

[lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

dbg_macro     = "warn"
panic         = "warn"
todo          = "warn"
unimplemented = "warn"

missing_errors_doc = "deny"
missing_panics_doc = "deny"

module_name_repetitions = "allow"
must_use_candidate      = "allow"

multiple_crate_versions = "allow"
cargo_common_metadata   = "allow"
