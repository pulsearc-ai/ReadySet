# Managed by ready-set-encrypt. Safe to edit; re-run `ready-set set secrets`
# to inspect drift. The bundled defaults below complement gitleaks' built-in
# rule set.
title = "ready-set-encrypt defaults"

[extend]
# Pull in the upstream rule set as the baseline.
useDefault = true

[[rules]]
id          = "anthropic-api-key"
description = "Anthropic Claude API key"
regex       = '''sk-ant-(?:api|admin)\d{2}-[A-Za-z0-9_\-]{32,}'''
tags        = ["key", "anthropic"]

[[rules]]
id          = "openai-project-key"
description = "OpenAI project / service key"
regex       = '''sk-(?:proj|svcacct)-[A-Za-z0-9_\-]{20,}'''
tags        = ["key", "openai"]

[[rules]]
id          = "fly-io-token"
description = "Fly.io API token"
regex       = '''FlyV1 [A-Za-z0-9+/=_\-]{40,}'''
tags        = ["token", "fly"]

[[rules]]
id          = "cloudflare-api-token"
description = "Cloudflare API token (cfut_ prefix)"
regex       = '''cfut_[A-Za-z0-9_\-]{30,}'''
tags        = ["token", "cloudflare"]

[[rules]]
id          = "github-classic-token"
description = "GitHub classic personal access token"
regex       = '''gh[pousr]_[A-Za-z0-9_]{36,}'''
tags        = ["token", "github"]

[[rules]]
id          = "github-fine-grained-token"
description = "GitHub fine-grained personal access token"
regex       = '''github_pat_[A-Za-z0-9_]{40,}'''
tags        = ["token", "github"]

[[rules]]
id          = "google-api-key"
description = "Google API key"
regex       = '''AIza[0-9A-Za-z_\-]{35}'''
tags        = ["key", "google"]

[[rules]]
id          = "slack-token-xoxe"
description = "Slack OAuth refresh / user token"
regex       = '''xox[ep](?:-[A-Za-z0-9]+){2,}'''
tags        = ["token", "slack"]

[[rules]]
id          = "slack-app-token"
description = "Slack app-level token"
regex       = '''xapp-1-[A-Z0-9]+-[0-9]+-[A-Za-z0-9]+'''
tags        = ["token", "slack"]

[[rules]]
id          = "resend-api-key"
description = "Resend API key"
regex       = '''re_[A-Za-z0-9]{8}_[A-Za-z0-9]{20,}'''
tags        = ["key", "resend"]

[[rules]]
id          = "sendgrid-api-key"
description = "SendGrid API key"
regex       = '''SG\.[A-Za-z0-9_\-]{16,}\.[A-Za-z0-9_\-]{16,}'''
tags        = ["key", "sendgrid"]

[[rules]]
id          = "stripe-secret-key"
description = "Stripe secret or restricted key"
regex       = '''[rs]k_(?:live|test)_[A-Za-z0-9]{24,}'''
tags        = ["key", "stripe"]

[allowlist]
description = "Common safe substrings"
paths       = [
  '''(.*\.)?env\.example$''',
  '''(.*\.)?env\.sample$''',
  '''deploy/secrets/.*\.rsb$''',
  '''\.ready-set/.*''',
  '''node_modules/.*''',
  '''target/.*''',
]
