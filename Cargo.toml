[workspace]
resolver = "3"
members  = ["ready-set", "ready-set-rust", "ready-set-sdk"]

[workspace.package]
edition      = "2024"
rust-version = "1.95"
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/pulsearc-ai/ready-set"

[workspace.dependencies]
anyhow             = "1"
clap               = { version = "4", features = ["derive"] }
directories        = "5"
getrandom          = { version = "0.3", features = ["std"] }
glob               = "0.3"
is-terminal        = "0.4"
semver             = { version = "1", features = ["serde"] }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
sha2               = "0.10"
tempfile           = "3"
thiserror          = "1"
time               = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
toml               = "0.8"
toml_edit          = "0.22"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir            = "2"
which              = "6"

[workspace.dependencies.ready-set-sdk]
path    = "ready-set-sdk"
version = "0.1.0"

[workspace.lints.rust]
unsafe_code              = "forbid"
missing_docs             = "deny"
let_underscore_drop      = "warn"
non_ascii_idents         = "warn"
single_use_lifetimes     = "warn"
trivial_casts            = "warn"
trivial_numeric_casts    = "warn"
unused_extern_crates     = "warn"
unused_import_braces     = "warn"
unused_lifetimes         = "warn"
unused_qualifications    = "warn"
variant_size_differences = "warn"

[workspace.lints.clippy]
all      = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "warn", priority = -1 }
cargo    = { level = "warn", priority = -1 }

# Restriction picks
dbg_macro     = "warn"
panic         = "warn"
todo          = "warn"
unimplemented = "warn"

# Documentation policy
missing_errors_doc = "deny"
missing_panics_doc = "deny"

# Pedantic exemptions to keep signal high
module_name_repetitions = "allow"
must_use_candidate      = "allow"

# Cargo-lint allows: these fire on workspace-wide facts (transitive dep
# duplication, per-crate readme) that are managed at the workspace level
# rather than per-crate.
multiple_crate_versions = "allow"
cargo_common_metadata   = "allow"
